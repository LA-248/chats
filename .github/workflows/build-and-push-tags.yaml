name: Build, tag, and push images

run-name: Build, tag, and push images

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  increment-server-tag:
    uses: ./.github/workflows/increment-tag.yaml
    with:
      tag-prefix: server

  increment-client-tag:
    uses: ./.github/workflows/increment-tag.yaml
    with:
      tag-prefix: client

  build-server:
    runs-on: ubuntu-latest
    needs: increment-server-tag
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'
      - run: npm ci
      - run: npm run build

  build-client:
    runs-on: ubuntu-latest
    needs: increment-client-tag
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20'
      - run: npm ci
      - run: npm run build

  build-and-push-server-image:
    runs-on: ubuntu-latest

    env:
      ECR_REPO: ${{ secrets.ECR_REPO }}
      ECR_PUBLIC_REGION: ${{ vars.ECR_PUBLIC_REGION }}
      IMAGE_TAG: ${{ needs.increment-server-tag.outputs.latest_tag }}

    needs: 
      - build-server
      - increment-server-tag

    defaults:
      run:
        working-directory: ./server
    
    steps:
      - name: Clone the repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::461201847742:role/github-actions-ecr-push
          aws-region: ${{ env.ECR_PUBLIC_REGION }}

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - id: tag
        name: Build and tag Docker image
        run: |
          docker build -t "$ECR_REPO:$IMAGE_TAG" .

      - name: Push Docker image to ECR
        run: |
          docker push "$ECR_REPO:$IMAGE_TAG"

  build-and-push-client-image:
    runs-on: ubuntu-latest

    env:
      ECR_REPO: ${{ secrets.ECR_REPO }}
      ECR_PUBLIC_REGION: ${{ vars.ECR_PUBLIC_REGION }}
      IMAGE_TAG: ${{ needs.increment-client-tag.outputs.latest_tag }}

    needs: 
      - build-client
      - increment-client-tag

    defaults:
      run:
        working-directory: ./client
    
    steps:
      - name: Clone the repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::461201847742:role/github-actions-ecr-push
          aws-region: ${{ env.ECR_PUBLIC_REGION }}

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - id: tag
        name: Build and tag Docker image
        run: |
          docker build -t "$ECR_REPO:$IMAGE_TAG" .

      - name: Push Docker image to ECR
        run: |
          docker push "$ECR_REPO:$IMAGE_TAG"